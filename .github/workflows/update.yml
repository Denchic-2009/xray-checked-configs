name: Update VPN Configs

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: 🐍 Установка Python и зависимостей
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Установка Python зависимостей
        run: |
          pip install --upgrade pip
          pip install aiohttp geoip2

      - name: 🌍 Скачивание GeoIP базы
        run: |
          echo "Downloading GeoLite2-Country.mmdb..."
          curl -L -o GeoLite2-Country.mmdb https://git.io/GeoLite2-Country.mmdb
          ls -lh GeoLite2-Country.mmdb

      - name: 🔽 Скачивание Xray
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip xray geoip.dat geosite.dat
          chmod +x xray
          sudo mv xray /usr/local/bin/

      - name: 🧹 Запуск fetcher.py
        run: python fetcher.py
        timeout-minutes: 12

      - name: 🔍 Запуск checker.py
        run: python checker.py
        timeout-minutes: 22

      - name: 📤 Коммит и пуш изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          
          git add config.txt config_ru.txt config_other.txt conf_ck.txt
          
          if git diff --cached --quiet; then
            echo "Нет изменений, пропускаем коммит"
          else
            git commit -m "🔄 Автообновление конфигов $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
